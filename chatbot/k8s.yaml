apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
        - name: chatbot
          image: chatbot
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: OPENAI_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: chatbot
spec:
  type: NodePort
  selector:
    app: chatbot
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30001